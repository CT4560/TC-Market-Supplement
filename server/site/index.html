  <meta name="robots" content="noindex, nofollow">
  <title>TC-Market Supplement</title>
  <meta name="description" content="繁中服 Universalis 沒有資料的物品（舊染劑等）的社群回報市場資料，提供公開的 REST API 與 WebSocket。">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <img src="logo.png" alt="" width="40" height="40">

    <nav class="nav" aria-label="主選單">
      <a href="#/" data-route="">概覽</a>
