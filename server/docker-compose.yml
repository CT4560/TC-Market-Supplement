# 用法：docker compose up -d --build
# 埠只綁 127.0.0.1，由同一台機器上的反向代理或 Cloudflare Tunnel 連進來。
# 明確指定專案名稱，避免跟同一台機器上的其他 compose 專案混在一起。
name: database-dalamud-collector

services:
  collector:
    build: .
    image: database-dalamud-collector-server
    restart: unless-stopped
    init: true
    environment:
      COMMUNITY_UPLOAD_ENABLED: "on"
      COMMUNITY_API_ENABLED: "on"
    ports:
      # 主機端的埠可用 COLLECTOR_PORT 調整（預設 8787）
      - "127.0.0.1:${COLLECTOR_PORT:-8787}:8787"
    volumes:
      # 資料庫放在具名資料卷，備份請備份整個資料卷
      - collector-data:/data
    # 唯讀根檔案系統、丟掉所有 capability、禁止提權
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m

volumes:
  collector-data:
